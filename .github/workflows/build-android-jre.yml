name: Build Android JRE
# Builds OpenJDK 17 / 21 for Android arm64 (Bionic) using the recipe from PojavLauncherTeam/android-openjdk-build-multiarch,
# checked out at a pinned commit (not vendored). The result is the Java runtime the Starlight Android app unpacks on first launch.
# OpenJDK is GPLv2 + Classpath Exception; the recipe repo carries its own terms. Takes 1-2 hours per version.
on:
  push:
    branches: [android-runtime]
    paths: ['.github/workflows/build-android-jre.yml']
  workflow_dispatch:
    inputs:
      versions:
        description: 'JDK versions as JSON array'
        default: '[17, 21]'
jobs:
  jre:
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(github.event.inputs.versions || '[17, 21]') }}
    name: JRE ${{ matrix.version }} (android arm64)
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/share/boost; df -h / | tail -1
      - name: Checkout build recipe (pinned)
        uses: actions/checkout@v4
        with:
          repository: PojavLauncherTeam/android-openjdk-build-multiarch
          ref: f3936fba6fcf14f45202c5dd8d2d8179dde051b2
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.version }}
          distribution: temurin
      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt -y install autoconf python3 python-is-python3 unzip zip systemtap-sdt-dev libxtst-dev libasound2-dev libelf-dev libfontconfig1-dev libx11-dev libxext-dev libxrandr-dev libxrender-dev libxt-dev
      - name: Build
        run: export TARGET_VERSION=${{ matrix.version }} && bash 1_ci_build_arch_aarch64.sh
      - name: Show result
        run: ls -lh jre*.tar.xz jdk*.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: jre${{ matrix.version }}-android-arm64
          path: jre${{ matrix.version }}*.tar.xz
          retention-days: 90
