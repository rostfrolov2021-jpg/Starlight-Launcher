name: Android app
# Builds the Starlight Android app (PojavLauncher-based, in android/) into an APK.
on:
  workflow_dispatch:
  push:
    branches: [android-fork]
    paths: ['android/**', '.github/workflows/android-app.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 8 for the :jre_lwjgl3glfw module toolchain, 17 (last = default JAVA_HOME) for Gradle/AGP
          java-version: |
            8
            17
      - name: Android SDK components
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" >/dev/null
      - name: Bundle Java runtimes (from the android-runtime pre-release)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p runtime
          gh release download android-runtime -p '*.tar.xz' -D runtime || echo "::warning::no android-runtime release yet, building without Java"
          RUNTIME_VERSION="${GITHUB_RUN_NUMBER}" bash android/scripts/repack-jre-arm64.sh runtime android/app_pojavlauncher/src/main/assets/components
      - name: Language list (generated file the build expects)
        run: bash scripts/languagelist_updater.sh
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        env:
          CF_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          if [ -n "$CF_KEY" ]; then export CURSEFORGE_API_KEY="$CF_KEY"; fi
          chmod +x gradlew
          ./gradlew :app_pojavlauncher:assembleDebug --no-daemon --stacktrace -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_17_X64
      - run: ls -lh app_pojavlauncher/build/outputs/apk/debug/
      - uses: actions/upload-artifact@v4
        with:
          name: starlight-android-apk
          path: android/app_pojavlauncher/build/outputs/apk/debug/*.apk
